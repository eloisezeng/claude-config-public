name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight — don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck, unit (incl. Postgres contract), e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The Postgres contract suite (lib/server/__tests__/postgresStore.test.ts) SKIPS ITSELF unless
    # TEST_DATABASE_URL points at a real database — and it is the only thing that exercises the
    # per-user advisory locks (pg_advisory_xact_lock) that serialize concurrent sync writes. Running
    # it against this service is the whole reason the job has a database attached: without it CI would
    # report green while the entire Postgres path went untested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: your-project_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The deploy path runs `next build`; nothing else in CI does. The e2e job boots `npm run dev`
      # (e2e/serverPlan.ts buildDevCommand), which compiles routes lazily as a test visits them — so
      # a route no spec opens, or a failure that only production triggers (static generation, route
      # collection, a build-time env read), reaches provision.sh having never been built once.
      # AUTH_SECRET is required because the build imports the Auth.js route under NODE_ENV=production
      # (deploy/README.md says so); the value is a CI throwaway and signs nothing. NEXT_PUBLIC_* is
      # inlined at build time, so it is set here for the same reason provision.sh sets it.
      - name: Production build (the artifact a deploy actually ships)
        env:
          AUTH_SECRET: ci-build-only-never-signs-a-real-session
          NEXT_PUBLIC_ANALYZER_URL: ""
        run: npm run build

      - name: Unit tests (with the Postgres contract suite live)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/your-project_test
        run: npm test

      # Fail loudly if the contract suite ever silently opts out again: a green run that skipped it
      # is exactly the false confidence this job exists to prevent.
      - name: Assert the Postgres contract suite actually ran
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/your-project_test
        run: |
          if npx vitest run lib/server/__tests__/postgresStore.test.ts --reporter=json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);const n=r.numTotalTests-r.numPendingTests;console.log('contract tests executed:',n);process.exit(n>0?0:1)})"; then
            echo "Postgres contract suite ran against a real database."
          else
            echo "::error::The Postgres contract suite executed 0 tests — it skipped itself. TEST_DATABASE_URL is not reaching it."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts boots its own dev server with AUTH_TEST_MODE=1 + DATA_BACKEND=memory,
      # so the e2e run needs no database and no .env.local.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  deploy:
    name: deploy — shellcheck + Caddyfile validate (with rate-limit plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships shellcheck; fail the build on any provision-script lint.
      - name: shellcheck deploy scripts
        run: shellcheck deploy/*.sh

      # Validate the Caddyfile with the SAME binary shape production runs: stock caddy would pass
      # a Caddyfile that silently lost its rate_limit block, and refuse the real one — so this
      # validation is only meaningful with the plugin loaded.
      - name: Install caddy + rate-limit plugin
        run: |
          curl -fsSL 'https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com/mholt/caddy-ratelimit' -o /usr/local/bin/caddy-rl
          chmod +x /usr/local/bin/caddy-rl
          /usr/local/bin/caddy-rl list-modules | grep -q '^http.handlers.rate_limit$'

      - name: Validate Caddyfile (as committed and with a substituted domain)
        run: |
          /usr/local/bin/caddy-rl validate --config deploy/Caddyfile --adapter caddyfile
          sed 's/your-project\.example\.com/ci-test.example.org/g' deploy/Caddyfile > /tmp/Caddyfile.sub
          /usr/local/bin/caddy-rl validate --config /tmp/Caddyfile.sub --adapter caddyfile

  analyzer:
    name: analyzer — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analyzer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      # librosa decodes audio fixtures through audioread, which shells out to ffmpeg for anything
      # that isn't a plain wav. It's present on the dev Mac via brew; the runner has no such luck.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q
